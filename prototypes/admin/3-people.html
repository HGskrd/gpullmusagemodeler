<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · People</title>
<link rel="stylesheet" href="common.css">
<style>
  .split { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }
  .dir { padding: 0; overflow: hidden; position: sticky; top: 10px; }
  .dir-f { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .dir-f input[type=search] { flex: 1 1 100%; }
  .dir-f select { flex: 1 1 45%; min-width: 0; }
  .dir-list { max-height: calc(100vh - 230px); overflow: auto; }
  .vrow { display: grid; grid-template-columns: 4px 1fr auto; gap: 0 10px; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .vrow:hover { background: var(--panel-2); }
  .vrow.on { background: var(--accent-soft); }
  .vrow .stripe { border-radius: 0 3px 3px 0; }
  .vrow .l1 { display: flex; gap: 6px; align-items: baseline; font-size: 12px; }
  .vrow .l2 { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vrow .r { text-align: right; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .dir-foot { padding: 7px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }

  .prof { display: flex; flex-direction: column; gap: 14px; }
  .ident { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .ident .big { font-size: 34px; line-height: 1; }
  .ident h2 { font-size: 17px; }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; margin-top: 12px; }
  @media (max-width: 700px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .facts .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .facts .v { font-size: 13px; }
  .why { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .intent { font-size: 14px; line-height: 1.5; }
  .plan { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .plan { grid-template-columns: 1fr; } }
  .plan .side { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .plan .side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
  .status.ok { color: var(--good-ink); }
  .status.bad { color: var(--critical); }

  .sess { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .sess + .sess { margin-top: 10px; }
  .sess-h { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; background: var(--panel-2); cursor: pointer; flex-wrap: wrap; }
  .sess-h .t { font-weight: 600; font-size: 12px; }
  .sess-b { padding: 6px 12px 10px; }
  .sess.closed .sess-b { display: none; }
  .step { display: grid; grid-template-columns: 58px 18px 1fr; gap: 6px; font-size: 12px; padding: 3px 0; align-items: baseline; }
  .step .ts { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); }
  .step .ic { text-align: center; color: var(--muted); }
  .step.bad .ic, .step.bad .tx { color: var(--critical); }
  .step.ok .ic { color: var(--good-ink); }
  .step.key .tx { font-weight: 600; }
  .step.dim .tx { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <header class="topbar" id="top"></header>
  <div class="banner">Prototype · synthetic sample data. One row per <b>person</b> (visitor cookie), not per event. Pick someone to read their sessions as a story.</div>
  <div class="filters" id="filters"></div>

  <div class="split">
    <aside class="card dir">
      <div class="dir-f">
        <input type="search" id="q" placeholder="Search id, city, GPU, model…">
        <select id="f-persona"></select>
        <select id="f-country"></select>
        <label class="chk"><input type="checkbox" id="f-eng" checked> Hide bounced</label>
        <label class="chk"><input type="checkbox" id="f-ret"> Returning only</label>
        <select id="f-sort" style="flex:1 1 100%"><option value="last">Sort: last seen</option><option value="depth">Sort: most engaged</option><option value="sessions">Sort: most sessions</option></select>
      </div>
      <div class="dir-list" id="list"></div>
      <div class="dir-foot" id="list-foot"></div>
    </aside>
    <main class="prof" id="prof"></main>
  </div>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { A, PERSONAS, PERSONA_ORDER, pColor, pchip, fmt, pct, flag, countryName, esc, shortGpu, shortModel, visible, filterBar, setCount, nav, engaged, dur, ago, datetime, date } = UI;
  const { GPU, MODEL } = A.catalog;
  nav(document.getElementById("top"), "People", "Individual profiles instead of an event firehose");

  const st = { q: "", persona: "", country: "", eng: true, ret: false, sort: "last", sel: null };
  // hash: #v=id | #persona=k | #country=XX
  for (const part of location.hash.slice(1).split("&")) {
    const [k, v] = part.split("=");
    if (k === "v") st.sel = v; if (k === "persona") st.persona = v; if (k === "country") st.country = v;
  }
  if (st.persona === "bouncer") st.eng = false;

  const $ = (id) => document.getElementById(id);
  $("f-persona").innerHTML = `<option value="">All personas</option>` + [...PERSONA_ORDER, "internal"].map((k) => `<option value="${k}">${PERSONAS[k].label}</option>`).join("");
  $("f-persona").value = st.persona;
  $("f-eng").checked = st.eng;
  const bind = (id, key, prop = "value") => $(id).addEventListener("input", () => { st[key] = $(id)[prop]; renderList(); });
  bind("q", "q"); bind("f-persona", "persona"); bind("f-country", "country"); bind("f-eng", "eng", "checked"); bind("f-ret", "ret", "checked"); bind("f-sort", "sort");
  filterBar($("filters"), () => { renderList(); });

  function summaryLine(v) {
    if (v.persona === "agent") {
      const c = v.sessions.flatMap((s) => s.events).filter((e) => e.type === "api_call");
      return `${c.length} API calls · ${esc(v.ua)}`;
    }
    const last = [...v.sessions].reverse().find((s) => s.final && (s.final.gpus.length || s.final.models.length));
    if (!last) return v.f.searches.length ? `searched “${esc(v.f.searches[0])}”` : "looked at the default scenario";
    const g = last.final.gpus.map((x) => `${x.qty}× ${shortGpu(x.key)}`).join(" + ");
    const m = last.final.models.map((x) => shortModel(x.name)).slice(0, 2).join(", ");
    return esc([g, m].filter(Boolean).join(" · ")) + (last.final.models.length > 2 ? ` +${last.final.models.length - 2}` : "");
  }

  function haystack(v) {
    return [v.id, v.city, countryName(v.country), v.channel, PERSONAS[v.persona].label, ...Object.keys(v.f.gpus).map((g) => GPU[g].name), ...Object.keys(v.f.models), ...v.f.searches].join(" ").toLowerCase();
  }

  function renderList() {
    let vs = visible();
    // when internal toggle is off, still allow the internal persona to be picked explicitly
    if (st.persona === "internal") vs = A.visitors.filter((v) => v.internal);
    setCount(vs.length);
    const countries = UI.countBy(vs, (v) => v.country);
    $("f-country").innerHTML = `<option value="">All countries</option>` + countries.map(([c, n]) => `<option value="${c}">${flag(c)} ${esc(countryName(c))} (${n})</option>`).join("");
    $("f-country").value = st.country;
    const q = st.q.trim().toLowerCase();
    let list = vs.filter((v) => (!st.persona || v.persona === st.persona) && (!st.country || v.country === st.country) && (!st.eng || engaged(v)) && (!st.ret || v.sessions.length > 1) && (!q || haystack(v).includes(q)));
    const sorters = { last: (a, b) => b.last - a.last, depth: (a, b) => b.f.config - a.f.config, sessions: (a, b) => b.sessions.length - a.sessions.length || b.last - a.last };
    list.sort(sorters[st.sort]);
    const shown = list.slice(0, 300);
    $("list").innerHTML = shown.map((v) => `
      <div class="vrow ${v.id === st.sel ? "on" : ""}" data-id="${v.id}">
        <div class="stripe" style="background:${pColor(v.persona)}"></div>
        <div style="min-width:0">
          <div class="l1"><span class="flag">${flag(v.country)}</span><b>${esc(v.city)}</b><span class="muted">${PERSONAS[v.persona].short}</span></div>
          <div class="l2">${summaryLine(v)}</div>
        </div>
        <div class="r">${ago(v.last)}<br>${v.sessions.length > 1 ? `${v.sessions.length} visits` : "1 visit"}</div>
      </div>`).join("") || `<div style="padding:20px" class="muted">No one matches.</div>`;
    $("list-foot").textContent = `${fmt(list.length)} people${list.length > shown.length ? ` · showing ${shown.length}` : ""}`;
    $("list").querySelectorAll(".vrow").forEach((r) => r.addEventListener("click", () => { st.sel = r.dataset.id; history.replaceState(null, "", "#v=" + st.sel); renderList(); }));
    if (!st.sel || !A.visitors.find((v) => v.id === st.sel)) st.sel = shown[0] && shown[0].id;
    renderProfile(A.visitors.find((v) => v.id === st.sel));
  }

  const ICON = { open: "→", session_reset: "↺", scenario_restore: "↻", gpu_add: "+", gpu_qty: "#", gpu_cost: "$", mode: "⇄", model_add: "+", model_prec: "↓", model_remove: "−",
    compare_duplicate: "⧉", compare_gpu: "⧉", econ_view: "$", use_case_add: "▤", projection_toggle: "↗", dist_slide: "⋮", settings_mu: "⚙", copy_link: "⤴", export_report: "⤓",
    scenario_export: "⤓", search: "?", scroll: "↧", feedback: "✎", api_call: "⌁" };
  function stepText(e) {
    switch (e.type) {
      case "open": return [`Landed on <span class="mono">${esc(e.path)}</span> (default scenario)`, "dim"];
      case "session_reset": return ["Cleared the default scenario", "dim"];
      case "scenario_restore": return ["Resumed their saved scenario", "dim"];
      case "gpu_add": return [`Added <b>${e.qty}× ${esc(GPU[e.gpu].name)}</b>`, "key"];
      case "gpu_qty": return [`Set ${esc(shortGpu(e.gpu))} count to <b>${e.qty}</b>`, ""];
      case "gpu_cost": return [`Entered <b>$${e.usd_hr}</b>/GPU-hr`, "key"];
      case "mode": return [`Switched to the <b>${e.mode.toUpperCase()}</b> tab`, "key"];
      case "model_add": return [`Added <b>${esc(e.model)}</b> at ${e.prec}`, "key"];
      case "model_prec": return [`Re-quantized ${esc(shortModel(e.model))} to <b>${e.prec}</b>`, ""];
      case "model_remove": return [`Removed ${esc(shortModel(e.model))}`, ""];
      case "result": return e.fits ? [`<span class="status ok">✓ Fits</span> <span class="muted">${fmt(e.need_gb)} of ${fmt(e.vram_gb)} GB</span>`, "ok"]
        : [`<span class="status bad">✕ Doesn’t fit</span>: needs ${fmt(e.need_gb)} GB, has ${fmt(e.vram_gb)} GB`, "bad"];
      case "compare_duplicate": return ["Opened A/B compare", "key"];
      case "compare_gpu": return [`Side B: <b>${e.qty}× ${esc(GPU[e.gpu].name)}</b>`, ""];
      case "econ_view": return [`Opened economics (${esc(e.tab)})`, "key"];
      case "use_case_add": return [`Added use-case “${esc(e.use_case)}”`, "key"];
      case "projection_toggle": return ["Turned on growth projection", ""];
      case "dist_slide": return [`Set TP/PP/DP to ${e.tp}/${e.pp}/${e.dp}`, ""];
      case "settings_mu": return [`Set context to ${Math.round(e.kv_ctx / 1024)}k`, ""];
      case "copy_link": return ["Copied a share link", "key"];
      case "export_report": return ["Exported the projection report", "key"];
      case "scenario_export": return ["Exported scenario JSON", "key"];
      case "search": return [`Searched “${esc(e.term)}” → <b>no results</b>`, "bad"];
      case "scroll": return [`Scrolled ${e.depth}% down, then left`, "dim"];
      case "feedback": return [`Left feedback: “${esc(e.text)}”`, "key"];
      case "api_call": return [`<span class="mono">${esc(e.endpoint)}</span>${e.gpu && e.endpoint.startsWith("POST") ? `: ${e.qty}× ${esc(shortGpu(e.gpu))} + ${esc(shortModel(e.model))} ${e.prec} → ${e.fits ? '<span class="status ok">✓ fits</span>' : '<span class="status bad">✕ no fit</span>'}` : ""}${e.status !== 200 ? ` <span class="status bad">HTTP ${e.status}</span>` : ""}`, e.status !== 200 ? "bad" : ""];
      default: return [esc(e.type), ""];
    }
  }

  function intent(v) {
    const f = v.f;
    if (v.persona === "bouncer") return f.searches.length ? `Came looking for <b>${esc(f.searches[0])}</b>, found nothing and left.` : "Opened the planner and left without changing anything. The default scenario didn’t hook them.";
    if (v.persona === "agent") {
      const calls = v.sessions.flatMap((s) => s.events).filter((e) => e.type === "api_call" && e.model);
      const m = UI.countBy(calls, (e) => e.model)[0];
      return `An assistant (<b>${esc(v.ua)}</b>) asking on someone’s behalf${m ? ` whether <b>${esc(shortModel(m[0]))}</b> runs on their hardware` : ""}.`;
    }
    const last = [...v.sessions].reverse().find((s) => s.final && s.final.gpus.length);
    const g = last ? last.final.gpus.map((x) => `${x.qty}× ${shortGpu(x.key)}`).join(" + ") : "hardware";
    const ms = last ? last.final.models.map((x) => shortModel(x.name)) : [];
    const mtxt = ms.length ? `<b>${esc(ms.slice(0, 2).join(" and "))}</b>${ms.length > 2 ? ` (+${ms.length - 2})` : ""}` : "a model";
    const bits = {
      homelab: `Trying to run ${mtxt} locally on <b>${esc(g)}</b>.`,
      buyer: `Sizing a purchase or rental: ${mtxt} on <b>${esc(g)}</b>${f.compare ? ", weighed against an alternative" : ""}${f.econ ? ", checked cloud vs. owning" : ""}.`,
      evaluator: `Surveying ${f.nModels} models, mostly large MoE, to see what <b>${esc(g)}</b> can hold.`,
      speech: `Planning speech/retrieval capacity: ${mtxt} on <b>${esc(g)}</b>.`,
      solutions: `Working back from a business workload to hardware: ${mtxt} on <b>${esc(g)}</b>.`,
      other: `Configured ${mtxt} on <b>${esc(g)}</b>; no clear pattern yet.`,
      internal: "You.",
    }[v.persona];
    const tail = [];
    if (f.oom && !f.recovered) tail.push(`Hit <span class="status bad">✕ doesn’t fit</span> ${f.oom}× and never got a fitting plan.`);
    else if (f.oom) tail.push(`Hit doesn’t-fit ${f.oom}× and worked around it.`);
    if (f.misses) tail.push(`Searched for things we don’t have (${f.searches.map((s) => `“${esc(s)}”`).join(", ")}).`);
    if (f.exports) tail.push("Took the result away (export/share).");
    return [bits, ...tail].join(" ");
  }

  function planSide(title, gpus, models, fit) {
    return `<div class="side"><h3>${title}</h3>
      ${gpus.length ? gpus.map((g) => `<div><b>${g.qty}×</b> ${esc(GPU[g.key].name)}</div>`).join("") : '<div class="muted">No hardware</div>'}
      <div style="margin-top:6px">${models.length ? models.map((m) => `<div>${esc(m.name)} <span class="tag">${m.prec}</span></div>`).join("") : '<div class="muted">No models</div>'}</div>
      ${fit == null ? "" : `<div style="margin-top:8px">${fit ? '<span class="status ok">✓ Fits</span>' : '<span class="status bad">✕ Doesn’t fit</span>'}</div>`}</div>`;
  }

  function renderProfile(v) {
    const el = $("prof");
    if (!v) { el.innerHTML = `<div class="card muted">Pick someone on the left.</div>`; return; }
    const f = v.f;
    const lastPlan = [...v.sessions].reverse().find((s) => s.final && (s.final.gpus.length || s.final.models.length));
    const cmp = v.sessions.flatMap((s) => s.events).filter((e) => e.type === "compare_gpu").pop();
    const localNow = new Date(A.meta.now + v.tz * 3600000);
    el.innerHTML = `
      <div class="card">
        <div class="ident">
          <div class="big">${flag(v.country)}</div>
          <div style="flex:1;min-width:220px">
            <h2>${esc(v.city)}, ${esc(countryName(v.country))} <span class="mono muted" style="font-size:12px;font-weight:400">${v.id}</span></h2>
            <div style="margin-top:4px">${pchip(v.persona, `<b>${PERSONAS[v.persona].label}</b>`)}</div>
            <div class="why">${v.why.map((w) => `<span class="tag">${esc(w)}</span>`).join("")}</div>
          </div>
        </div>
        <div class="facts">
          <div><div class="k">First seen</div><div class="v">${datetime(v.first)}</div></div>
          <div><div class="k">Last seen</div><div class="v">${ago(v.last)}</div></div>
          <div><div class="k">Visits</div><div class="v">${v.sessions.length} · ${dur(f.durMs)} total</div></div>
          <div><div class="k">Arrived via</div><div class="v">${esc(v.channel)}${v.utm ? `<div class="mono muted" style="font-size:10px">${esc(v.utm)}</div>` : ""}</div></div>
          <div><div class="k">Device</div><div class="v">${v.device === "agent" ? esc(v.ua) : `${esc(v.device)} · ${esc(v.os)}`}</div></div>
          <div><div class="k">Language</div><div class="v">${esc(v.lang)}</div></div>
          <div><div class="k">Their local time now</div><div class="v">${String(localNow.getUTCHours()).padStart(2, "0")}:${String(localNow.getUTCMinutes()).padStart(2, "0")} (UTC${v.tz >= 0 ? "+" : ""}${v.tz})</div></div>
          <div><div class="k">Entry page</div><div class="v mono">${esc(v.entry)}</div></div>
        </div>
      </div>
      <div class="card">
        <h2>What they seem to be trying to do</h2>
        <p class="intent" style="margin-top:6px">${intent(v)}</p>
      </div>
      ${lastPlan ? `<div class="card"><h2>Where they ended up</h2><div class="q">Final state of their last configured visit (${date(lastPlan.start)}).</div>
        <div class="plan">${planSide("Plan A", lastPlan.final.gpus, lastPlan.final.models, lastPlan.final.fit)}
        ${cmp ? planSide("Compared against (B)", [{ key: cmp.gpu, qty: cmp.qty }], lastPlan.final.models, null) : `<div class="side muted" style="display:flex;align-items:center;justify-content:center">No A/B comparison</div>`}</div></div>` : ""}
      <div class="card">
        <div class="card-head"><h2>Visits</h2><span class="spacer"></span><button class="btn" id="exp-all">Expand all</button></div>
        <div class="q">Newest first. Each step is a recorded action; red = friction.</div>
        <div id="sessions"></div>
      </div>`;
    const ss = [...v.sessions].reverse();
    $("sessions").innerHTML = ss.map((s, i) => {
      const bad = s.events.filter((e) => (e.type === "result" && !e.fits) || e.type === "search").length;
      const fin = s.final;
      return `<div class="sess ${i > 1 ? "closed" : ""}">
        <div class="sess-h"><span class="t">${datetime(s.start)}</span><span class="muted">${dur(s.end - s.start)} · ${s.events.length} steps${bad ? ` · <span class="status bad">${bad} friction</span>` : ""}</span>
          <span class="spacer" style="flex:1"></span><span class="muted mono" style="font-size:10px">tab ${s.tab}</span></div>
        <div class="sess-b">${s.events.map((e) => {
          const [tx, cls] = stepText(e);
          const off = Math.round((e.t - s.start) / 1000);
          return `<div class="step ${cls}"><span class="ts">+${off >= 60 ? Math.floor(off / 60) + "m" + String(off % 60).padStart(2, "0") : off + "s"}</span><span class="ic">${ICON[e.type] || "·"}</span><span class="tx">${tx}</span></div>`;
        }).join("")}</div></div>`;
    }).join("");
    $("sessions").querySelectorAll(".sess-h").forEach((h) => h.addEventListener("click", () => h.parentElement.classList.toggle("closed")));
    $("exp-all").addEventListener("click", () => $("sessions").querySelectorAll(".sess").forEach((s) => s.classList.remove("closed")));
  }

  renderList();
})();
</script>
</body>
</html>
